[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "labelrite"
version = "0.1.0"
description = "Reference implementation of LabelRite: real-time detection of anomalous annotators via reference-distribution modeling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ambarish Majumdar", email = "amjemails@gmail.com" }]
dependencies = ["numpy"]
keywords = ["machine-learning", "data-quality", "crowdsourcing", "anomaly-detection", "label-quality", "rlhf"]

[project.urls]
Paper = "https://doi.org/10.5281/zenodo.22887754"

[tool.setuptools.packages.find]
where = ["."]
include = ["labelrite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
